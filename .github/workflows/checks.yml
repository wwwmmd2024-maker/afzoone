name: PHP, licensing and packaging checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: openssl
          coverage: none
      - name: PHP syntax
        run: find product-image-finder license-server -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript and Python syntax
        run: |
          node --check product-image-finder/assets/admin.js
          python3 -m py_compile tools/build.py tools/send_webhook.py
      - name: Install isolated PHP test runtime
        run: npm install --prefix .tools @php-wasm/cli@3.1.58
      - name: License service and plugin verifier integration
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: node tests/integration.mjs
      - name: Build template and verify reproducibility
        run: |
          python3 tools/build.py
          python3 tests/test_package.py
          git diff --exit-code -- packages/
